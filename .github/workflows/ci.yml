name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: RAG metrics regression gate (HotpotQA subset)
        run: python -m llm_eval_harness.cli baseline data/hotpotqa_distractor_dev_50.jsonl --gate data/baseline_hotpotqa_50.json
